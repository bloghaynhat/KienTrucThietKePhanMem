services:
  orchestrator:
    build:
      context: ./orchestrator-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user:8081
      TOUR_SERVICE_URL: http://tour:8082
      BOOKING_SERVICE_URL: http://booking:8083
      PAYMENT_SERVICE_URL: http://payment:8084
    depends_on:
      - user
      - tour
      - booking
      - payment

  user:
    build:
      context: ./user-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081

  tour:
    build:
      context: ./tour-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082

  booking:
    build:
      context: ./booking-service
    ports:
      - "8083:8083"
    environment:
      PORT: 8083

  payment:
    build:
      context: ./payment-service
    ports:
      - "8084:8084"
    environment:
      PORT: 8084

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_ORCHESTRATOR_URL: http://orchestrator:8080
    depends_on:
      - orchestrator
